name: Mock build and tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga
      - run: dotnet restore CpuLab.sln --locked-mode
      - run: dotnet build CpuLab.sln --no-restore --configuration Release
      - run: dotnet test CpuLab.sln --no-build --configuration Release
      - name: Mock smoke run (no hardware or external executables)
        run: dotnet run --project src/CpuLab.Cli --configuration Release --no-build -- mock --scenario scenarios/mock-demo.json --legacy fixtures/legacy/manual-results.json
      - name: Synthetic CSV import smoke
        run: dotnet run --project src/CpuLab.Cli --configuration Release --no-build -- import-hwinfo --file fixtures/hwinfo/synthetic.csv --profile fixtures/hwinfo/profile.json
      - name: Lightweight process supervisor smoke
        run: dotnet run --project src/CpuLab.Cli --configuration Release --no-build -- process-demo
      - name: Three-attempt fixture series smoke
        run: dotnet run --project src/CpuLab.Cli --configuration Release --no-build -- probe-series --scenario scenarios/probe-series.json
